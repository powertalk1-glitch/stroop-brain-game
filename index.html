<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10223f">
  <meta name="description" content="腦筋急轉色：適合兒童、成人與長輩的繁體中文色字反應挑戰。">
  <title>腦筋急轉色｜色字反應挑戰</title>
  <style>
    :root{--navy:#10223f;--navy-2:#193354;--paper:#f7f3e9;--white:#fffefa;--ink:#152238;--muted:#687386;--line:#d9d6cc;--lime:#b7e34b;--lime-dark:#577615;--danger:#d43f4f;--success:#14845c;--shadow:0 18px 50px rgba(16,34,63,.14);--radius:22px}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:"Arial Rounded MT Bold","Microsoft JhengHei","PingFang TC",sans-serif;background:var(--paper);color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
    button{font:inherit}button:focus-visible{outline:4px solid #2878ff;outline-offset:3px}.app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr;padding:env(safe-area-inset-top) max(18px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(18px,env(safe-area-inset-left))}
    .topbar{width:min(1040px,100%);margin:0 auto;min-height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.04em}.brand-mark{width:34px;height:34px;border-radius:50%;background:conic-gradient(#e5484d 0 25%,#f2bd2e 0 50%,#2878ff 0 75%,#159b68 0);border:4px solid var(--navy);box-shadow:0 0 0 3px var(--white)}
    .icon-btn{border:1px solid var(--line);background:var(--white);color:var(--ink);min-width:48px;height:48px;border-radius:50%;cursor:pointer;font-size:1.2rem}.screen{display:none;width:min(1040px,100%);margin:0 auto;padding:clamp(12px,4vh,42px) 0 34px}.screen.active{display:block}
    .eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--lime-dark);font-weight:900}.home-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,6vw,76px);align-items:center;min-height:calc(100dvh - 130px)}h1{font-size:clamp(3rem,8vw,6.8rem);line-height:.89;letter-spacing:-.07em;margin:.12em 0 .22em;color:var(--navy)}.lead{font-size:clamp(1rem,2vw,1.28rem);line-height:1.7;color:var(--muted);max-width:560px}.rule-line{display:flex;align-items:center;gap:10px;margin-top:26px;font-size:.9rem;color:var(--muted)}.rule-dots{display:flex}.rule-dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--paper);margin-left:-3px}
    .profile-list{display:grid;gap:12px}.profile-card{display:grid;grid-template-columns:58px 1fr auto;gap:15px;align-items:center;border:2px solid transparent;background:var(--white);padding:18px;border-radius:var(--radius);box-shadow:0 8px 26px rgba(16,34,63,.08);cursor:pointer;text-align:left;color:var(--ink);transition:transform .16s,border-color .16s}.profile-card:hover{transform:translateY(-2px);border-color:var(--navy)}.profile-icon{height:58px;border-radius:17px;display:grid;place-items:center;background:var(--navy);color:var(--lime);font-size:1.45rem;font-weight:900}.profile-card strong{display:block;font-size:1.15rem}.profile-card small{display:block;color:var(--muted);margin-top:4px;line-height:1.35}.arrow{font-size:1.6rem;color:var(--muted)}
    .panel{background:var(--white);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:clamp(22px,4vw,44px)}.setup-head{display:flex;align-items:start;justify-content:space-between;gap:20px;margin-bottom:28px}.setup-head h2,.result-title{font-size:clamp(2rem,5vw,4rem);line-height:1;margin:8px 0 0;letter-spacing:-.05em}.back-btn{border:0;background:transparent;color:var(--muted);padding:12px;cursor:pointer}.choice-section{margin:28px 0}.choice-section h3{font-size:.88rem;letter-spacing:.08em;margin:0 0 12px;color:var(--muted)}.segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{min-height:92px;border:2px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);padding:13px 10px;cursor:pointer}.choice strong{display:block;font-size:1.05rem}.choice small{display:block;color:var(--muted);margin-top:6px;font-size:.78rem}.choice.selected{background:var(--navy);border-color:var(--navy);color:#fff}.choice.selected small{color:#cbd5e1}.rules-box{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:#edf3dd;padding:16px;border-radius:16px;margin:24px 0}.rules-box b{color:var(--lime-dark)}.primary{width:100%;min-height:62px;border:0;border-radius:18px;background:var(--lime);color:var(--navy);font-size:1.12rem;font-weight:900;cursor:pointer;box-shadow:0 8px 0 #779d20;transform:translateY(-4px)}.primary:active{box-shadow:0 3px 0 #779d20;transform:translateY(1px)}
    #game-screen{padding-top:10px}.hud{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin-bottom:14px}.timer-wrap{height:18px;background:#dfe3e7;border-radius:999px;overflow:hidden;position:relative}.round-bar{height:100%;width:100%;background:var(--lime);transform-origin:left center}.hud-stat{min-width:94px;background:var(--white);border:1px solid var(--line);padding:9px 13px;border-radius:14px;text-align:center}.hud-stat small{display:block;color:var(--muted);font-size:.68rem}.hud-stat strong{font-size:1.2rem;font-variant-numeric:tabular-nums}.arena{min-height:calc(100dvh - 165px);background:var(--navy);border-radius:30px;color:#fff;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;box-shadow:var(--shadow);position:relative}.arena-top{display:flex;justify-content:center;padding:24px}.rule-badge{background:var(--lime);color:var(--navy);padding:10px 18px;border-radius:999px;font-weight:900;letter-spacing:.06em}.prompt-zone{display:grid;place-items:center;text-align:center;padding:15px}.prompt-label{color:#a8b7ca;font-size:.85rem;letter-spacing:.16em}.prompt-word{font-size:clamp(5.5rem,22vw,13rem);line-height:1;font-weight:900;margin-top:10px;text-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .12s}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 16px 23px;background:rgba(255,255,255,.06)}.answer{min-height:82px;border:3px solid rgba(255,255,255,.13);border-radius:18px;background:#fff;color:var(--ink);cursor:pointer;font-size:1.35rem;font-weight:900;display:flex;align-items:center;justify-content:center;gap:9px}.swatch{width:18px;height:18px;border-radius:50%}.answer.correct{border-color:#41d596;background:#dffff1}.answer.wrong{border-color:#ff7180;background:#ffe3e6}.answer:disabled{cursor:default}.flash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:clamp(2rem,7vw,4.5rem);font-weight:900;opacity:0}.flash.show{animation:flash-pop .34s ease-out}.flash.good{color:#75efbd}.flash.bad{color:#ff8792}@keyframes flash-pop{0%{opacity:0;transform:scale(.7)}35%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
    .overlay{position:fixed;inset:0;background:rgba(8,19,35,.94);z-index:20;display:none;place-items:center;color:#fff;text-align:center;padding:24px}.overlay.active{display:grid}.count-number{font-size:clamp(6rem,28vw,14rem);line-height:1;color:var(--lime);font-variant-numeric:tabular-nums}.overlay p{color:#cbd5e1;font-size:1.1rem}.resume-btn{width:min(320px,100%)}
    .result-wrap{max-width:720px;margin:3vh auto}.score-hero{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line);padding:28px 0}.score-number{font-size:clamp(4rem,16vw,8.5rem);line-height:.8;letter-spacing:-.08em;color:var(--navy);font-variant-numeric:tabular-nums}.score-label{color:var(--muted);text-align:right}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:28px 0}.stat{background:var(--white);padding:20px 10px;text-align:center}.stat strong{display:block;font-size:1.5rem}.stat small{color:var(--muted)}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.secondary{min-height:62px;border:2px solid var(--navy);border-radius:18px;background:transparent;color:var(--navy);cursor:pointer;font-weight:900}.disclaimer{text-align:center;color:var(--muted);font-size:.76rem;margin-top:20px}
    body.profile-child .arena,body.profile-child .panel{border-radius:34px}body.profile-child .answer{min-height:94px;font-size:1.55rem}body.profile-senior{font-size:18px}body.profile-senior .prompt-word{font-size:clamp(7rem,25vw,15rem)}body.profile-senior .answer{min-height:100px;font-size:1.65rem;border-width:4px}body.profile-senior .arena *{animation-duration:.01ms!important}
    @media(max-width:760px){.home-grid{grid-template-columns:1fr;align-content:start;padding-top:5vh}.home-copy{text-align:center}.lead{margin-inline:auto}.rule-line{justify-content:center}.segmented{grid-template-columns:1fr}.choice{min-height:68px;text-align:left;padding-left:18px}.choice small{display:inline;margin-left:8px}.setup-head{align-items:center}.answers{grid-template-columns:repeat(2,1fr)}.answers.two{grid-template-columns:repeat(2,1fr)}.arena{min-height:calc(100dvh - 145px)}.hud-stat{min-width:74px;padding:7px}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:clamp(3.7rem,18vw,6rem)}}
    @media(max-width:410px){.topbar{min-height:58px}.brand{font-size:.88rem}.brand-mark{width:29px;height:29px}.screen{padding-top:4px}.arena-top{padding:15px}.answer{min-height:70px}.prompt-word{font-size:clamp(5rem,27vw,8rem)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>腦筋急轉色</span></div><button id="sound-toggle" class="icon-btn" type="button" aria-label="關閉音效" title="切換音效">🔊</button></header>
  <main>
    <section id="home-screen" class="screen active" aria-labelledby="main-title">
      <div class="home-grid"><div class="home-copy"><div class="eyebrow">60 秒色字反應挑戰</div><h1 id="main-title">眼睛看到的，<br>大腦同意嗎？</h1><p class="lead">文字說一套，顏色做一套。壓住第一直覺，在時間內做出正確判斷。</p><div class="rule-line"><span class="rule-dots"><i style="background:#e5484d"></i><i style="background:#f2bd2e"></i><i style="background:#2878ff"></i><i style="background:#159b68"></i></span><span>選擇玩家模式開始</span></div></div>
        <div class="profile-list" aria-label="玩家模式">
          <button class="profile-card" data-profile="adult"><span class="profile-icon">A</span><span><strong>成人挑戰</strong><small>標準節奏，考驗速度與專注</small></span><span class="arrow">→</span></button>
          <button class="profile-card" data-profile="child"><span class="profile-icon">K</span><span><strong>兒童模式</strong><small>適合 6–12 歲，大字與寬鬆時間</small></span><span class="arrow">→</span></button>
          <button class="profile-card" data-profile="senior"><span class="profile-icon">S</span><span><strong>長輩模式</strong><small>最大字體、高對比、舒適節奏</small></span><span class="arrow">→</span></button>
        </div></div>
    </section>
    <section id="setup-screen" class="screen" aria-labelledby="setup-title"><div class="panel"><div class="setup-head"><div><div id="profile-label" class="eyebrow">成人挑戰</div><h2 id="setup-title">設定這一局</h2></div><button id="back-home" class="back-btn" type="button">← 返回</button></div>
      <div class="choice-section"><h3>01　選擇玩法</h3><div id="mode-choices" class="segmented">
        <button class="choice selected" data-mode="ink"><strong>看字色</strong><small>回答字體顏色</small></button><button class="choice" data-mode="word"><strong>看字義</strong><small>回答文字內容</small></button><button class="choice" data-mode="mixed"><strong>混合指令</strong><small>每題切換規則</small></button>
      </div></div>
      <div class="choice-section"><h3>02　選擇難度</h3><div id="difficulty-choices" class="segmented">
        <button class="choice selected" data-difficulty="easy"><strong>簡單</strong><small>四色常駐・舒適節奏</small></button><button class="choice" data-difficulty="normal"><strong>普通</strong><small>四色常駐・標準節奏</small></button><button class="choice" data-difficulty="hard"><strong>困難</strong><small>四色常駐・疾速節奏</small></button>
      </div></div>
      <div class="rules-box"><span aria-hidden="true">◎</span><div><b id="rule-summary">只看字體呈現的顏色</b><br><span>答對越快分數越高；答錯不扣分，但連擊會歸零。</span></div></div><button id="start-game" class="primary" type="button">開始 60 秒挑戰</button></div>
    </section>
    <section id="game-screen" class="screen" aria-label="遊戲進行中"><div class="hud"><div class="timer-wrap" aria-label="剩餘時間"><div id="round-bar" class="round-bar"></div></div><div class="hud-stat"><small>分數</small><strong id="score">0</strong></div><div class="hud-stat"><small>連擊</small><strong id="streak">0</strong></div></div>
      <div class="arena"><div class="arena-top"><div id="rule-badge" class="rule-badge">看字色</div></div><div class="prompt-zone"><div><div class="prompt-label">請選出正確答案</div><div id="prompt-word" class="prompt-word">紅</div></div></div><div id="answers" class="answers"></div><div id="flash" class="flash" aria-live="polite"></div></div>
    </section>
    <section id="result-screen" class="screen" aria-labelledby="result-title"><div class="panel result-wrap"><div class="eyebrow">挑戰完成</div><h2 id="result-title" class="result-title">大腦成功突圍</h2><div class="score-hero"><div><div id="result-score" class="score-number">0</div><small>本局總分</small></div><div id="result-context" class="score-label">成人挑戰<br>看字色・簡單</div></div><div class="stats"><div class="stat"><strong id="result-correct">0</strong><small>答對</small></div><div class="stat"><strong id="result-accuracy">0%</strong><small>正確率</small></div><div class="stat"><strong id="result-average">0.00s</strong><small>平均反應</small></div><div class="stat"><strong id="result-streak">0</strong><small>最高連擊</small></div></div><div class="result-actions"><button id="play-again" class="primary" type="button">再玩一次</button><button id="change-settings" class="secondary" type="button">更改設定</button></div><p class="disclaimer">本遊戲僅供娛樂與腦力挑戰用途，並非醫療或認知診斷工具。</p></div></section>
  </main>
</div>
<div id="countdown-overlay" class="overlay" role="dialog" aria-modal="true"><div><div id="count-number" class="count-number">3</div><p id="count-message">準備好，專心看清楚指令</p></div></div>
<div id="pause-overlay" class="overlay" role="dialog" aria-modal="true"><div><div class="count-number">Ⅱ</div><h2>遊戲已暫停</h2><p>回到畫面後，按下按鈕倒數 3 秒繼續。</p><button id="resume-game" class="primary resume-btn" type="button">繼續挑戰</button></div></div>
<script src="engine.js"></script><script src="app.js"></script>
</body>
</html>
